<!DOCTYPE html> 
<html lang="en">
     <head>
         <meta charset="UTF-8"> 
         <meta name="viewport" content="width=device-width, initial-scale=1"> 
         <title>Contact - Learning Management System</title> 
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
         </head> 
         <body class="bg-light"> 
            <div class="container mt-5">
                 <h2 class="mb-4">Contact Us</h2>
                  <form onsubmit="return validateContact()">
                     <div class="mb-3"> 
                        <label class="form-label">Name</label> 
                        <input type="text" id="cname" class="form-control" placeholder="Enter Name"> 
                    </div>
                      <div class="mb-3">
                         <label class="form-label">Email</label> 
                         <input type="email" id="cemail" class="form-control" placeholder="Enter Email">
                         </div>
                       <div class="mb-3"> 
                        <label class="form-label">Message</label>
                         <textarea id="message" class="form-control" rows="4" placeholder="Enter Your Message"></textarea>
                         </div> 
                       <button type="submit" class="btn btn-primary">Send Message</button>
                        <button type="reset" class="btn btn-secondary">Clear</button> 
                    </form> 
                </div>
                         <script> function validateContact() { 
                            let name = document.getElementById("cname").value; 
                            let email = document.getElementById("cemail").value; 
                            let message = document.getElementById("message").value; 
                            
                            if (name=="" || email=="" || message=="") { alert("All fields required!"); return false; } 
                            if (!email.includes("@")) { alert("Invalid email!"); return false; }
                            if (message.length < 10) { alert("Message should be at least 10 characters!"); return false; }
                             alert("Message sent successfully!");
                             return true; 
                             }
                              </script> 
                              </body>
 </html>
